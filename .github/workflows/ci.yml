name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: HA integration (solaredge_one)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        # The client library lives in its own repo (CathalOConnorRH/solaredge-v2)
        # and is published to PyPI. Install exactly what manifest.json requires,
        # so the CI pin can never drift from the one HA/HACS install at runtime.
        run: |
          pip install $(python -c "import json; print(' '.join(json.load(open('custom_components/solaredge_one/manifest.json'))['requirements']))")
          pip install pytest-homeassistant-custom-component ruff mypy
      - name: Ruff
        run: ruff check custom_components/solaredge_one tests
      - name: Mypy (strict)
        run: mypy --strict custom_components/solaredge_one
      - name: Pytest
        run: pytest tests -q
