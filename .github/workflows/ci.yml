name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: HA integration (solaredge_one)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        # The client library lives in its own repo (CathalOConnorRH/solaredge-v2)
        # and is published to PyPI. Pin matches manifest.json requirements.
        run: |
          pip install "aiosolaredge-one==0.2.0"
          pip install pytest-homeassistant-custom-component ruff mypy
      - name: Ruff
        run: ruff check custom_components/solaredge_one tests
      - name: Mypy (strict)
        run: mypy --strict custom_components/solaredge_one
      - name: Pytest
        run: pytest tests -q
