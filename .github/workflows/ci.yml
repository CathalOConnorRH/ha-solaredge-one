name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: HA integration (solaredge_one)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        # The client library lives in its own repo. Until it is published to
        # PyPI, install it straight from git; afterwards replace this with
        #   pip install "aiosolaredge-one==<version>"
        # (the version pinned in custom_components/solaredge_one/manifest.json).
        run: |
          pip install "aiosolaredge-one @ git+https://github.com/CathalOConnorRH/solaredge-v2.git@main"
          pip install pytest-homeassistant-custom-component ruff
      - name: Ruff
        run: ruff check custom_components/solaredge_one tests
      - name: Pytest
        run: pytest tests -q
