name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-run daily so upstream hassfest/HACS rule changes surface quickly.
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons live in home-assistant/brands; until that PR is merged
          # the brands check would fail. Remove this ignore once merged.
          ignore: brands
